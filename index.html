<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asteroids</title>
  <style>
    
    body {
      margin: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #fff;
      gap: 12px;
    }
    #hud {
      display: flex;
      gap: 32px;
      font-size: 14px;
      color: #aaa;
    }
    #hud strong {
      color: #fff;
    }
    canvas {
      background: #000;
      border-radius: 8px;
      display: block;
      outline: none;
    }
    #controls {
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span>SCORE: <strong id="score">0</strong></span>
    <span>LIVES: <strong id="lives">3</strong></span>
    <span>LEVEL: <strong id="level">1</strong></span>
  </div>
  <canvas id="c" width="660" height="480" tabindex="0"></canvas>
  <div id="controls">Arrow keys / WASD &mdash; move &nbsp;|&nbsp; Space &mdash; fire &nbsp;|&nbsp; P &mdash; pause &nbsp;|&nbsp; Enter &mdash; restart</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    let ship, bullets, asteroids, particles, score, lives, level, gameOver, paused, invincible, keys, animId;

    function init() {
      score = 0; lives = 3; level = 1; gameOver = false; paused = false; invincible = 0;
      keys = {};
      ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, angle: -Math.PI / 2, radius: 12 };
      bullets = [];
      particles = [];
      asteroids = spawnAsteroids(4 + level);
      document.getElementById('score').textContent = 0;
      document.getElementById('lives').textContent = 3;
      document.getElementById('level').textContent = 1;
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function spawnAsteroids(n) {
      const arr = [];
      for (let i = 0; i < n; i++) {
        let x, y;
        do { x = Math.random() * W; y = Math.random() * H; }
        while (Math.hypot(x - W / 2, y - H / 2) < 120);
        arr.push(makeAsteroid(x, y, 3));
      }
      return arr;
    }

    function makeAsteroid(x, y, size) {
      const speed = (0.4 + Math.random() * 0.8) * (4 - size) * 0.5 + 0.3;
      const angle = Math.random() * Math.PI * 2;
      const r = size === 3 ? 45 : size === 2 ? 28 : 15;
      const pts = [];
      const n = 10 + Math.floor(Math.random() * 5);
      for (let i = 0; i < n; i++) {
        pts.push(r * (0.7 + Math.random() * 0.3));
      }
      return { x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size, r, pts, rot: 0, rotSpeed: (Math.random() - 0.5) * 0.02 };
    }

    function explode(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 40 + Math.random() * 30, color });
      }
    }

    function shoot() {
      if (bullets.length > 6) return;
      bullets.push({
        x: ship.x + Math.cos(ship.angle) * 14,
        y: ship.y + Math.sin(ship.angle) * 14,
        vx: Math.cos(ship.angle) * 10 + ship.vx,
        vy: Math.sin(ship.angle) * 10 + ship.vy,
        life: 55
      });
    }

    function wrap(obj) {
      if (obj.x < -60) obj.x = W + 60;
      if (obj.x > W + 60) obj.x = -60;
      if (obj.y < -60) obj.y = H + 60;
      if (obj.y > H + 60) obj.y = -60;
    }

    function drawShip() {
      if (invincible > 0 && Math.floor(invincible / 5) % 2 === 0) return;
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(14, 0);
      ctx.lineTo(-10, 9);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-10, -9);
      ctx.closePath();
      ctx.stroke();
      if (keys['ArrowUp'] || keys['w'] || keys['W']) {
        ctx.strokeStyle = '#f84';
        ctx.beginPath();
        ctx.moveTo(-6, 0);
        ctx.lineTo(-14 - Math.random() * 6, 0);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawAsteroid(a) {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const n = a.pts.length;
      for (let i = 0; i < n; i++) {
        const angle = (i / n) * Math.PI * 2;
        const r = a.pts[i];
        if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
        else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    let shootCooldown = 0;

    function loop() {
      animId = requestAnimationFrame(loop);

      if (paused || gameOver) {
        if (gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 36px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
          ctx.font = '18px monospace';
          ctx.fillText('Score: ' + score, W / 2, H / 2 + 20);
          ctx.fillText('Press Enter to restart', W / 2, H / 2 + 50);
        }
        if (paused) {
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 28px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('PAUSED', W / 2, H / 2);
        }
        return;
      }

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      if (keys['ArrowLeft'] || keys['a'] || keys['A']) ship.angle -= 0.06;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) ship.angle += 0.06;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) {
        ship.vx += Math.cos(ship.angle) * 0.25;
        ship.vy += Math.sin(ship.angle) * 0.25;
      }
      ship.vx *= 0.98; ship.vy *= 0.98;
      const maxSpeed = 7;
      const sp = Math.hypot(ship.vx, ship.vy);
      if (sp > maxSpeed) { ship.vx = ship.vx / sp * maxSpeed; ship.vy = ship.vy / sp * maxSpeed; }
      ship.x += ship.vx; ship.y += ship.vy;
      wrap(ship);
      if (invincible > 0) invincible--;

      if (shootCooldown > 0) shootCooldown--;
      if ((keys[' '] || keys['Space']) && shootCooldown === 0) { shoot(); shootCooldown = 10; }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx; b.y += b.vy;
        b.life--;
        if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
          bullets.splice(i, 1); continue;
        }
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        for (let j = asteroids.length - 1; j >= 0; j--) {
          const a = asteroids[j];
          if (Math.hypot(b.x - a.x, b.y - a.y) < a.r) {
            bullets.splice(i, 1);
            explode(a.x, a.y, '#aaa', 12);
            const pts = [500, 150, 50];
            score += pts[3 - a.size] * level;
            document.getElementById('score').textContent = score;
            if (a.size > 1) {
              asteroids.push(makeAsteroid(a.x + (Math.random() - 0.5) * 20, a.y + (Math.random() - 0.5) * 20, a.size - 1));
              asteroids.push(makeAsteroid(a.x + (Math.random() - 0.5) * 20, a.y + (Math.random() - 0.5) * 20, a.size - 1));
            }
            asteroids.splice(j, 1);
            break;
          }
        }
      }

      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.vx; a.y += a.vy;
        a.rot += a.rotSpeed;
        wrap(a);
        drawAsteroid(a);

        if (invincible === 0 && Math.hypot(ship.x - a.x, ship.y - a.y) < a.r + 10) {
          lives--;
          document.getElementById('lives').textContent = lives;
          explode(ship.x, ship.y, '#8af', 20);
          if (lives <= 0) { gameOver = true; return; }
          ship.x = W / 2; ship.y = H / 2; ship.vx = 0; ship.vy = 0;
          invincible = 120;
        }
      }

      if (asteroids.length === 0) {
        level++;
        document.getElementById('level').textContent = level;
        asteroids = spawnAsteroids(4 + level);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.96; p.vy *= 0.96;
        p.life--;
        ctx.globalAlpha = p.life / 60;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        if (p.life <= 0) particles.splice(i, 1);
      }

      drawShip();
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
      if (e.key === 'p' || e.key === 'P') paused = !paused;
      if (e.key === 'Enter' && gameOver) init();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
      if (e.key === 'p' || e.key === 'P') paused = !paused;
      if (e.key === 'Enter' && gameOver) init();
    });
    canvas.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.focus();
    init();
  </script>
</body>
</html>
